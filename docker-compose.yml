services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        STREAM_MODEL: ${STREAM_MODEL:-phate334/Breeze-ASR-25-ct2}
    ports:
      - "8000:8000"
    environment:
      - STREAM_MODEL=${STREAM_MODEL:-phate334/Breeze-ASR-25-ct2}
      - DEVICE=${DEVICE:-cpu}
      - COMPUTE_TYPE=${COMPUTE_TYPE:-int8}
      - ASR_BACKEND=${ASR_BACKEND:-faster-whisper}
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-20}
      # 接 wez 機器上 whisper namespace 的 LLM nodeport(10.1.1.7 是 wez 本機 IP)
      - LLM_BASE_URL=${LLM_BASE_URL:-http://10.1.1.7:31367/v1}
      - LLM_MODEL=${LLM_MODEL:-MediaTek-Research/Llama-Breeze2-8B-Instruct}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.2}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1024}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "8444:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsmeet-tls/server.crt:/etc/letsmeet-tls/server.crt:ro
      - /etc/letsmeet-tls/server.key:/etc/letsmeet-tls/server.key:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
