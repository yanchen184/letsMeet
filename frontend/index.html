<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>letsMeet</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <span class="logo">letsMeet</span>
      <span id="connState" class="badge offline">待機</span>
      <span id="elapsed" class="elapsed" aria-label="已錄時間">00:00:00</span>
    </div>
  </header>

  <main>
    <section class="controls" role="group" aria-label="錄音控制">
      <button id="btnStart" class="btn primary" type="button">錄音</button>
      <button id="btnStop" class="btn" type="button" disabled>停止</button>
      <button id="btnAsk" class="btn" type="button" disabled
              title="逐字稿至少要 3 行才能產出有意義的問題">產生問題</button>
      <label id="autoAskToggle" class="toggle" title="每累積數行逐字稿,自動產出追問">
        <input id="chkAutoAsk" type="checkbox" />
        <span>自動產問</span>
      </label>
      <button id="btnClear" class="btn danger-ghost" type="button"
              title="清空逐字稿與問題,需要點兩次確認">清空</button>
      <button id="btnDownload" class="btn ghost" type="button">匯出 .md</button>
    </section>

    <section class="panel context-panel" aria-labelledby="h-context">
      <div class="panel-head">
        <h2 id="h-context">會議背景</h2>
        <button id="btnContextToggle" class="context-toggle" type="button"
                aria-expanded="true" aria-controls="contextBody">收合</button>
      </div>
      <div id="contextBody" class="context-body">
        <div class="preset-row" role="group" aria-label="情境範本">
          <span class="preset-label">情境範本</span>
          <button class="preset" type="button" data-preset="client">跟甲方溝通</button>
          <button class="preset" type="button" data-preset="engineer">跟工程師溝通</button>
          <button class="preset" type="button" data-preset="pm">跟 PM 溝通</button>
          <button class="preset" type="button" data-preset="eng_pm">工程師 × PM</button>
        </div>
        <label class="context-sublabel" for="contextHint">我的角色與重點</label>
        <textarea id="contextHint" class="context-input" rows="3"
          placeholder="先告訴 AI 你的角色與重點，例如：我是採購方，重點在價格、交期與保固。點上方範本可快速帶入，錄音中也能隨時補充。"></textarea>
        <label class="context-sublabel" for="meetingInfo">會議資訊</label>
        <textarea id="meetingInfo" class="context-input" rows="3"
          placeholder="這場會議的議程、與會者、想達成的目標，例如：今天跟甲方確認驗收標準與交期，與會者有對方採購與技術主管，目標是敲定第一期交付範圍。"></textarea>
      </div>
    </section>

    <section class="panel" aria-labelledby="h-transcript">
      <div class="panel-head">
        <h2 id="h-transcript">逐字稿</h2>
        <button id="btnAskRange" class="btn-inline" type="button" hidden
                title="只針對選取的逐字稿區間產生問題">問選取區間</button>
        <button id="btnClearSel" class="btn-inline ghost-inline" type="button" hidden
                title="取消選取">取消選取</button>
        <span id="transcriptStat" class="stat">—</span>
      </div>

      <!-- 重點摘要：產問時順手把該批新發言壓成條列，預設可見 -->
      <div id="digestArea" class="digest-area" hidden>
        <div class="digest-head">
          <span class="digest-title">重點摘要</span>
          <span class="digest-hint">產問時自動整理</span>
        </div>
        <div id="digestList" class="digest-list"></div>
      </div>

      <!-- 完整逐字稿：預設折疊，需要選區/核對時展開 -->
      <details id="transcriptDetails" class="transcript-details">
        <summary class="transcript-summary">展開完整逐字稿</summary>
        <div id="transcript" class="transcript" aria-live="polite">
          <p class="placeholder">
            按「錄音」開始即時轉錄。會請求麥克風權限,音訊僅在本機處理。
          </p>
        </div>
      </details>
    </section>

    <section class="panel chat-panel" aria-labelledby="h-chat">
      <div class="panel-head">
        <h2 id="h-chat">問 AI / 討論提問方向</h2>
        <span id="chatStat" class="stat">—</span>
      </div>
      <div id="chatLog" class="chat-log" aria-live="polite">
        <p class="placeholder">
          隨時問 AI 剛剛逐字稿講了什麼，或一起討論接下來該怎麼問。
        </p>
      </div>
      <form id="chatForm" class="chat-form">
        <textarea id="chatInput" class="chat-input" rows="2"
          placeholder="例如：剛剛對方對交期是怎麼說的？／幫我想三個該追問的點。Enter 送出，Shift+Enter 換行。"></textarea>
        <button id="chatSend" class="btn primary" type="submit">送出</button>
      </form>
    </section>

    <section class="panel" aria-labelledby="h-questions">
      <div class="panel-head">
        <h2 id="h-questions">建議追問</h2>
        <span id="questionsStat" class="stat">—</span>
      </div>
      <div id="questions" class="questions">
        <p class="placeholder">按「產生問題」由 AI 從逐字稿產出 3–5 個追問。</p>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
