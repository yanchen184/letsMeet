<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>letsMeet</title>
  <link rel="stylesheet" href="assets/style.css?v=cockpit1" />
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <span class="logo">letsMeet</span>
      <div class="session-meter" aria-label="會議狀態">
        <span id="connState" class="badge offline">待機</span>
        <span id="elapsed" class="elapsed" aria-label="已錄時間">00:00:00</span>
        <span class="waveform" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </span>
      </div>
      <span class="pin-status" title="儲存會議時可設定四位 PIN">PIN 保護</span>
      <button id="btnHistory" class="btn ghost top-history" type="button">歷史會議</button>
    </div>
  </header>

  <main class="app-shell">
    <section class="controls" role="group" aria-label="錄音控制">
      <button id="btnStart" class="btn primary rail-action" type="button">
        <span aria-hidden="true">◉</span>
        錄音
      </button>
      <button id="btnStop" class="btn rail-action" type="button" disabled>
        <span aria-hidden="true">■</span>
        停止
      </button>
      <button id="btnAsk" class="btn rail-action" type="button" disabled
              title="逐字稿至少要 3 行才能產出有意義的問題">
        <span aria-hidden="true">✦</span>
        產生問題
      </button>
      <label id="autoAskToggle" class="toggle rail-action" title="每累積數行逐字稿,自動產出追問">
        <input id="chkAutoAsk" type="checkbox" />
        <span aria-hidden="true">✧</span>
        自動產問
      </label>
      <button id="btnDownload" class="btn ghost rail-action" type="button">
        <span aria-hidden="true">↓</span>
        匯出 .md
      </button>
      <button id="btnSaveMeeting" class="btn rail-action" type="button" disabled>
        <span aria-hidden="true">▣</span>
        儲存會議
      </button>
      <button id="btnClear" class="btn danger-ghost rail-action" type="button"
              title="清空逐字稿與問題,需要點兩次確認">
        <span aria-hidden="true">×</span>
        清空
      </button>
    </section>

    <div class="cockpit">
      <section class="panel context-panel" aria-labelledby="h-context">
        <div class="panel-head">
          <h2 id="h-context">會議背景</h2>
          <p class="panel-subtitle">點擊展開設定角色與會議目標</p>
          <button id="btnContextToggle" class="context-toggle" type="button"
                  aria-expanded="false" aria-controls="contextBody">展開</button>
        </div>
        <div id="contextBody" class="context-body" hidden>
          <div class="preset-row" role="group" aria-label="情境範本">
            <span class="preset-label">情境範本</span>
            <button class="preset" type="button" data-preset="client">跟甲方溝通</button>
            <button class="preset" type="button" data-preset="engineer">跟工程師溝通</button>
            <button class="preset" type="button" data-preset="pm">跟 PM 溝通</button>
            <button class="preset" type="button" data-preset="eng_pm">工程師 × PM</button>
          </div>
          <div class="context-grid">
            <label class="context-field">
              <span class="context-sublabel">我的角色與重點</span>
              <textarea id="contextHint" class="context-input" rows="3"
                placeholder="例如：我是採購方，重點在價格、交期與保固。"></textarea>
            </label>
            <label class="context-field">
              <span class="context-sublabel">會議資訊</span>
              <textarea id="meetingInfo" class="context-input" rows="3"
                placeholder="例如：今天跟甲方確認驗收標準與交期，目標是敲定第一期交付範圍。"></textarea>
            </label>
          </div>
        </div>
      </section>

      <section class="panel transcript-panel" aria-labelledby="h-transcript">
        <div class="panel-head">
          <h2 id="h-transcript">重點摘要與逐字稿</h2>
          <button id="btnAskRange" class="btn-inline" type="button" hidden
                  title="只針對選取的逐字稿區間產生問題">問選取區間</button>
          <button id="btnClearSel" class="btn-inline ghost-inline" type="button" hidden
                  title="取消選取">取消選取</button>
          <span id="transcriptStat" class="stat">—</span>
        </div>

        <div id="digestArea" class="digest-area" hidden>
          <div class="digest-head">
            <span class="digest-title">重點摘要</span>
            <span class="digest-hint">產問時自動整理</span>
          </div>
          <div id="digestList" class="digest-list"></div>
        </div>

        <details id="transcriptDetails" class="transcript-details" open>
          <summary class="transcript-summary">完整逐字稿</summary>
          <div id="transcript" class="transcript" aria-live="polite">
            <p class="placeholder">
              按「錄音」開始即時轉錄。會請求麥克風權限,音訊僅在本機處理。
            </p>
          </div>
        </details>
      </section>

      <aside class="side-stack" aria-label="AI 輔助區">
        <section class="panel questions-panel" aria-labelledby="h-questions">
          <div class="panel-head">
            <h2 id="h-questions">建議追問</h2>
            <span id="questionsStat" class="stat">—</span>
          </div>
          <div id="questions" class="questions">
            <p class="placeholder">按「產生問題」由 AI 從逐字稿產出 3–5 個追問。</p>
          </div>
        </section>

        <section class="panel chat-panel" aria-labelledby="h-chat">
          <div class="panel-head">
            <h2 id="h-chat">問 AI</h2>
            <span id="chatStat" class="stat">—</span>
          </div>
          <div id="chatLog" class="chat-log" aria-live="polite">
            <p class="placeholder">
              隨時問 AI 剛剛逐字稿講了什麼，或一起討論接下來該怎麼問。
            </p>
          </div>
          <form id="chatForm" class="chat-form">
            <textarea id="chatInput" class="chat-input" rows="2"
              placeholder="例如：幫我整理決議事項。Enter 送出，Shift+Enter 換行。"></textarea>
            <button id="chatSend" class="btn primary" type="submit" aria-label="送出">➤</button>
          </form>
        </section>
      </aside>

      <div id="saveMeetingForm" class="save-meeting-form" hidden>
        <div class="save-meeting-form__row">
          <label class="save-meeting-form__label" for="saveMeetingTitle">標題</label>
          <input id="saveMeetingTitle" class="save-meeting-form__input" type="text" placeholder="這場會議的標題" />
        </div>
        <div class="save-meeting-form__row">
          <label class="save-meeting-form__label" for="saveMeetingOwner">填寫者</label>
          <input id="saveMeetingOwner" class="save-meeting-form__input" type="text" placeholder="你的名字" />
        </div>
        <div class="save-meeting-form__row">
          <label class="save-meeting-form__label" for="saveMeetingPin">PIN</label>
          <input id="saveMeetingPin" class="save-meeting-form__input pin-input" type="text"
                 inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="選填 4 位數" />
        </div>
        <div class="save-meeting-form__actions">
          <button id="btnSaveMeetingConfirm" class="btn primary" type="button">確認儲存</button>
          <button id="btnSaveMeetingCancel" class="btn ghost" type="button">取消</button>
          <span id="saveMeetingMsg" class="save-meeting-form__msg" hidden></span>
        </div>
      </div>
    </div>

    <div id="historyModal" class="history-modal" hidden>
      <div class="history-modal__panel">
        <button class="history-modal__close" type="button" aria-label="關閉">×</button>
        <div class="history-modal__listView">
          <div class="history-modal__head">
            <h2>歷史會議</h2>
            <p>受保護的會議需要 PIN 才能查看內容</p>
          </div>
          <input class="history-filter" type="text" placeholder="搜尋會議標題或擁有者" />
          <ul class="history-list"></ul>
        </div>
        <div class="history-modal__detailView" hidden></div>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <span class="app-footer__models" id="modelInfo">
      <span class="model-chip" title="即時逐字稿模型">逐字稿 <code id="asrModel">—</code></span>
      <span class="model-chip" title="產問／摘要／問 AI 模型">AI <code id="llmModel">—</code></span>
    </span>
  </footer>

  <script src="assets/app.js?v=cockpit2"></script>
</body>
</html>
